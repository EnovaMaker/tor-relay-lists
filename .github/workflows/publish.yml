name: publish
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes; the consensus changes hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest
      # Written to the repository root, so a list lives at the same path the older
      # service used: only the owner in the URL changes.
      - run: python3 tor_relay_lists.py --out .
      - name: Commit if the lists changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.txt'
          # The header carries the consensus time, which changes hourly.
          git diff --cached --quiet || { git commit -qm "updated $(date -u +%H:%M:%S) UTC" && git push; }
